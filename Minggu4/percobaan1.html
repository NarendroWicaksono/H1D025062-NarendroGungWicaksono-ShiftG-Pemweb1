<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>praktikum pemweb</title>
  </head>
  <body>
    <script>
      let nama = "Andi";
      let usia = 40;
      usia = usia / 2 - 1;
      let alamat = "jl. HR Bunyamin";
      let telpon = "123" + 4568;
      document.write("<h1>hai, sekarang anda sedang belajar javascript!</h1>");
      document.write("nama : " + nama);
      document.write("<br>usia : " + usia);

      document.write("<br>telpon : " + telpon); // telepon
    </script>
  </body>
