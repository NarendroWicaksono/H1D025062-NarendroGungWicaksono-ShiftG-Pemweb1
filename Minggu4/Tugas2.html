<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Sederhana</title>
</head>
<body>

    <h3>Kalkulator Sederhana</h3>

    <form onsubmit="return false;">
        <table border="1">
            <tr>
                <th>Angka 1</th>
                <th>Operasi</th>
                <th>Angka 2</th>
                <th>Hasil</th>
            </tr>
            <tr>
                <td><input type="text" id="angka1" class="input-angka" placeholder="0"></td>
                <td>
                    <button onclick="hitung('+')">+</button>
                    <button onclick="hitung('-')">-</button>
                    <button onclick="hitung('*')">×</button>
                    <button onclick="hitung('/')">÷</button>
                </td>
                <td><input type="text" id="angka2" placeholder="0"></td>
                <td id="hasil" style="font-weight: bold; text-align: center;">-</td>
            </tr>
        </table>
    </form>

    <script>
        function hitung(operator) {
            var val1 = document.getElementById("angka1").value;
            var val2 = document.getElementById("angka2").value;

            if (val1 === "" || val2 === "") {
                alert("Kedua kotak angka wajib diisi!");
                return;
            }

            var num1 = parseFloat(val1);
            var num2 = parseFloat(val2);
            var hasil = 0;

            if (operator === '+') {
                hasil = num1 + num2;
            } else if (operator === '-') {
                hasil = num1 - num2;
            } else if (operator === '*') {
                hasil = num1 * num2;
            } else if (operator === '/') {
                if (num2 === 0) {
                    alert("Tidak dapat dibagi dengan 0!");
                    return;
                }
                hasil = num1 / num2;
            }

            document.getElementById("hasil").innerText = hasil;
        }
    </script>

</body>
</html>
